name: Build and test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and run regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore core library
        run: dotnet restore Ricis.Core.csproj

      - name: Restore regression tests
        run: dotnet restore RegressionTests/Ricis.Core.RegressionTests.csproj

      - name: Restore application projects
        run: |
          dotnet restore Ricis.Console/Ricis.Console.csproj
          dotnet restore Ricis.NavierStokes.Console/Ricis.NavierStokes.Console.csproj
          dotnet restore Ricis.WebApi/Ricis.WebApi.csproj
          dotnet restore Ricis.WebAssembly/Ricis.WebAssembly.csproj

      - name: Build core library
        run: dotnet build Ricis.Core.csproj --configuration Release --no-restore

      - name: Build regression tests
        run: dotnet build RegressionTests/Ricis.Core.RegressionTests.csproj --configuration Release --no-restore

      - name: Build application projects
        run: |
          dotnet build Ricis.Console/Ricis.Console.csproj --configuration Release --no-restore
          dotnet build Ricis.NavierStokes.Console/Ricis.NavierStokes.Console.csproj --configuration Release --no-restore
          dotnet build Ricis.WebApi/Ricis.WebApi.csproj --configuration Release --no-restore
          dotnet build Ricis.WebAssembly/Ricis.WebAssembly.csproj --configuration Release --no-restore

      - name: Verify unified Ricis.Core version
        shell: bash
        run: |
          projects=(
            Ricis.Core.csproj
            Ricis.Console/Ricis.Console.csproj
            Ricis.NavierStokes.Console/Ricis.NavierStokes.Console.csproj
            Ricis.WebApi/Ricis.WebApi.csproj
            Ricis.WebAssembly/Ricis.WebAssembly.csproj
            RegressionTests/Ricis.Core.RegressionTests.csproj
          )
          expected=""
          for project in "${projects[@]}"; do
            current=$(dotnet msbuild "$project" -getProperty:Version | tail -n 1)
            echo "$project => $current"
            if [[ -z "$expected" ]]; then expected="$current"; fi
            if [[ "$current" != "$expected" ]]; then
              echo "Version mismatch: expected $expected, got $current in $project"
              exit 1
            fi
          done
          echo "All projects use Ricis.Core version $expected"

      - name: Run regression suite
        run: dotnet run --project RegressionTests/Ricis.Core.RegressionTests.csproj --configuration Release --no-build

      - name: Smoke-test Swagger and expression API
        run: |
          ASPNETCORE_ENVIRONMENT=Development nohup dotnet Ricis.WebApi/bin/Release/net8.0/Ricis.WebApi.dll --urls http://127.0.0.1:5044 > /tmp/ricis-webapi.log 2>&1 &
          api_pid=$!
          cleanup_api() {
            status=$?
            if [ "$status" -ne 0 ] && [ -f /tmp/ricis-webapi.log ]; then
              echo '--- Ricis.WebApi startup log ---'
              cat /tmp/ricis-webapi.log
              echo '--- End Ricis.WebApi startup log ---'
            fi
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup_api EXIT
          for attempt in $(seq 1 30); do
            if curl --max-time 10 -fsS http://127.0.0.1:5044/health > /tmp/ricis-health.json; then
              curl --max-time 10 -fsS http://127.0.0.1:5044/swagger/v1/swagger.json > /tmp/ricis-openapi.json
              break
            fi
            sleep 1
          done
          kill -0 "$api_pid"
          grep -q '"title":"RICIS III Web API"' /tmp/ricis-openapi.json
          grep -q '"operationId":"SimplifyExpression"' /tmp/ricis-openapi.json
          node <<'NODE'
          const fs = require('fs');
          const document = JSON.parse(fs.readFileSync('/tmp/ricis-openapi.json', 'utf8'));
          const requiredExamples = {
            '/api/expressions/simplify': ['linear', 'singular', 'about metadata'],
            '/api/expressions/derivative': ['polynomial', 'reciprocal bridge', 'trigonometric'],
            '/api/expressions/system': ['two curves', 'coordinate system', 'singular system']
          };
          for (const [path, names] of Object.entries(requiredExamples)) {
            const operation = document.paths?.[path]?.post;
            if (!operation?.summary || !operation?.description) throw new Error(`Missing OpenAPI metadata: ${path}`);
            const examples = operation.requestBody?.content?.['application/json']?.examples ?? {};
            for (const name of names) if (!examples[name]?.value?.expression) throw new Error(`Missing example ${name}: ${path}`);
          }
          for (const schema of ['ExpressionRequest', 'ExpressionResponse', 'ExpressionSystemResponse', 'ParseErrorResponse']) {
            if (!document.components?.schemas?.[schema]?.description) throw new Error(`Missing XML schema description: ${schema}`);
          }
          console.log('Swagger metadata, examples and XML schema descriptions verified.');
          NODE
          curl --max-time 10 -fsS -X POST http://127.0.0.1:5044/api/expressions/simplify \
            -H 'Content-Type: application/json' \
            -d '{"expression":"x => ((x ^ 2) - 25) / (x - 5)"}' \
            > /tmp/ricis-simplify.json
          grep -q '"ricis":"x => (x + 5)"' /tmp/ricis-simplify.json

      - name: Setup Lean toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y elan
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Generate and compile LeanDoc
        run: |
          dotnet run --project Ricis.Console/Ricis.Console.csproj --configuration Release --no-build -- --lean-doc-demo > /tmp/ricis_generated.lean
          dotnet run --project Ricis.Console/Ricis.Console.csproj --configuration Release --no-build -- --lean-a6-demo > /tmp/ricis_a6_generated.lean
          cd FormalVerification/Lean
          lake env lean /tmp/ricis_generated.lean
          lake env lean /tmp/ricis_a6_generated.lean
          if grep -niE 'sorry|sorryAx' /tmp/ricis_generated.lean /tmp/ricis_a6_generated.lean; then
            echo "Generated LeanDoc contains forbidden sorry token."
            exit 1
          fi
